<head>
<meta charset="utf-8">

<meta name="theme-color" content="#0E1219" media="(prefers-color-scheme: dark)">

<meta name="mobile-web-app-capable" content="yes">

<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:0}

<title>Treasure Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#F1F3F7; --surface:#FFFFFF; --surface2:#E7EBF1; --ink:#18202C; --muted:#5A6475; --line:#D6DCE5;
  --accent:#C4352D; --accent-soft:#F8E3E1; --on-accent:#FFFFFF; --gold:#9A6B00; --gold-soft:#F6ECD2;
  --good:#1D8456; --good-soft:#DDF1E7; --warn:#A8670F; --warn-soft:#F7EAD5; --bad:#C4352D;
  --shadow:0 1px 2px rgba(24,32,44,.06),0 6px 20px rgba(24,32,44,.08);
  --s1:#2B6CB0; --s2:#C4352D;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0E1219; --surface:#161C26; --surface2:#202837; --ink:#E6EAF0; --muted:#97A1B2; --line:#2A3343;
  --accent:#E8574E; --accent-soft:#3A1D1C; --on-accent:#FFFFFF; --gold:#E2B24D; --gold-soft:#342A15;
  --good:#44B883; --good-soft:#15301F; --warn:#E3A541; --warn-soft:#3A2A12; --bad:#F06B61;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  --s1:#5A93D6; --s2:#E8574E;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1219; --surface:#161C26; --surface2:#202837; --ink:#E6EAF0; --muted:#97A1B2; --line:#2A3343;
  --accent:#E8574E; --accent-soft:#3A1D1C; --on-accent:#FFFFFF; --gold:#E2B24D; --gold-soft:#342A15;
  --good:#44B883; --good-soft:#15301F; --warn:#E3A541; --warn-soft:#3A2A12; --bad:#F06B61;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  --s1:#5A93D6; --s2:#E8574E;
}
*{box-sizing:border-box}
html{height:100%;box-sizing:border-box;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;height:100%;overflow:hidden;margin:0;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
.app{height:100%;display:flex;flex-direction:column;position:relative}
.scroller{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior-y:contain}
button,a,label,select{touch-action:manipulation}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:880px;margin:0 auto;padding-inline:16px;padding-block:0 88px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:18px 10px}
.brand{font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:.02em;line-height:1;text-transform:uppercase}
.brand span{color:var(--accent)}
.sub{color:var(--muted);font-size:13px}
h2{font-family:var(--display);font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.03em;margin:22px 0 10px;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:18px;text-transform:uppercase;letter-spacing:.03em;margin:0 0 8px}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:.9em;letter-spacing:-.01em}
.muted{color:var(--muted)}
.pos{color:var(--good)} .neg{color:var(--bad)}
.banner{border:1px dashed var(--gold);background:var(--gold-soft);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:6px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:640px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.tile .v{font-family:var(--display);font-weight:700;font-size:28px;line-height:1.1;margin-top:4px}
.tile .d{font-size:12px;color:var(--muted);margin-top:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:flex;gap:12px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.row:first-child{border-top:0}
.row:hover{background:var(--surface2)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m{font-size:12.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:2px}
.row .r{text-align:right;flex-shrink:0}
.thumb{width:44px;aspect-ratio:63/88;border-radius:4px;background:var(--surface2);border:1px solid var(--line);flex-shrink:0;object-fit:cover;display:grid;place-items:center;font-family:var(--mono);font-size:8px;color:var(--muted);overflow:hidden;text-align:center;line-height:1.1}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--surface2);color:var(--ink);letter-spacing:.02em;white-space:nowrap}
.chip.jp{background:var(--accent-soft);color:var(--accent)}
.chip.gr{background:var(--gold-soft);color:var(--gold)}
.chip.ok{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn)}
.empty{padding:22px 14px;text-align:center;color:var(--muted);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;font-size:14px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:focus-visible,.row:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.seg label:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar.spread{justify-content:space-between}
.search{flex:1;min-width:160px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.filters{display:flex;gap:6px;overflow-x:auto;padding-block:8px;scrollbar-width:none}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer;white-space:nowrap}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
select.small{padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:13px}
nav.tabs{position:relative;flex:0 0 auto;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:0;z-index:20}
nav.tabs .in{display:flex;width:100%;max-width:880px}
@supports ((-webkit-backdrop-filter:blur(8px)) or (backdrop-filter:blur(8px))){nav.tabs{background:color-mix(in srgb,var(--surface) 88%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px)}}
nav.tabs button{flex:1;border:0;background:none;padding:10px 4px 9px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
.fab{position:absolute;right:16px;bottom:78px;z-index:21;border-radius:999px;padding:13px 18px;box-shadow:var(--shadow)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,20,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;border-radius:16px 16px 0 0;padding-inline:16px;padding-block:6px calc(24px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow)}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:16px;max-height:88vh;max-height:88dvh}}
/* installed app: the tab bar runs into the home-indicator area */
:root.standalone{padding-bottom:0}
.standalone nav.tabs{padding-bottom:env(safe-area-inset-bottom,0px)}
.standalone .fab{bottom:calc(78px + env(safe-area-inset-bottom,0px))}
/* touch screens: 16px fields stop iPhone from zooming in, bigger tap targets */
@media (pointer:coarse){
  input,select,textarea,.search,.field input,.field select,.field textarea,.newrow input,.newrow select,.trow input,.trow select{font-size:16px}
  .btn{min-height:42px}
  .btn.sm{min-height:36px;padding:7px 12px}
  .row{padding:12px}
  .filters button{padding:7px 13px;font-size:14px}
  nav.tabs button{padding:9px 4px 8px;font-size:11.5px}
  nav.tabs button svg{width:24px;height:24px}
  .x{width:38px;height:38px}
}
@media (max-width:699px){header.top{padding-block:10px 4px}.brand{font-size:26px}.sub{display:none}h2{margin:18px 0 8px}}
/* big phones (Pro Max ~440px): a little more room */
@media (min-width:420px) and (max-width:699px){
  .wrap{padding-inline:18px}
  .tile .v{font-size:30px}
}
.sheet-head{position:sticky;top:0;background:var(--bg);display:flex;justify-content:space-between;align-items:center;padding-block:12px 10px;z-index:2;border-bottom:1px solid var(--line);margin-bottom:12px;gap:10px}
.sheet-head h3{margin:0;font-size:21px}
.x{border:0;background:var(--surface2);border-radius:999px;width:34px;height:34px;cursor:pointer;font-size:18px;flex-shrink:0}
form .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
form .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
input[type="date"]{-webkit-appearance:none;appearance:none;min-width:0;display:block;min-height:40px}
.sheet{overflow-x:hidden}
.sheet .mono{overflow-wrap:anywhere}
.field input,.field select,.field textarea{padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface);width:100%;min-width:0}
.field textarea{min-height:84px;resize:none;-webkit-user-select:text;user-select:text;line-height:1.4}
input,textarea{-webkit-user-select:text;user-select:text}
.hint{font-size:12px;color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg label{flex:1;text-align:center;padding:8px 6px;cursor:pointer;font-size:13.5px;font-weight:600;border-left:1px solid var(--line)}
.seg label:first-child{border-left:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--ink);color:var(--bg)}
fieldset{border:0;padding:0;margin:0;min-width:0}
.section{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.photo-drop{display:flex;gap:12px;align-items:center}
.photo-drop .thumb{width:72px;font-size:10px}
.detail-top{display:grid;grid-template-columns:130px 1fr;gap:14px;align-items:start}
.detail-top .big{width:100%;aspect-ratio:63/88;border-radius:8px;object-fit:cover;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--mono);color:var(--muted);font-size:13px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.kv div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.kv b{display:block;font-family:var(--display);font-size:20px;font-weight:700;line-height:1.15}
.links{display:flex;flex-wrap:wrap;gap:6px}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th,table.t td{padding:8px 10px;border-top:1px solid var(--line);text-align:left;white-space:nowrap}
table.t th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);border-top:0}
table.t td.r,table.t th.r{text-align:right}
.scroll{overflow-x:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.pl{display:flex;justify-content:space-between;padding:7px 0;border-top:1px dashed var(--line);font-size:14px}
.pl:first-child{border-top:0}
.pl.total{border-top:2px solid var(--ink);font-weight:700;font-size:16px;margin-top:4px}
.cols{display:grid;gap:14px}
@media (min-width:700px){.cols.two{grid-template-columns:1fr 1fr}}
.pad{padding:12px}
.stat-line{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin-top:6px}
.guide p{margin:6px 0;font-size:14px;max-width:65ch}
.chip.lot{background:var(--ink);color:var(--bg)}
.chip.grd{background:var(--surface);color:var(--warn);border:1px solid var(--warn)}
.stack{position:relative;width:44px;flex-shrink:0;aspect-ratio:63/88}
.stack .thumb{position:absolute;width:40px;inset:auto}
.stack .thumb:nth-child(1){left:6px;top:0;opacity:.55}
.stack .thumb:nth-child(2){left:3px;top:2px;opacity:.8}
.stack .thumb:nth-child(3){left:0;top:4px}
.stack .count{position:absolute;right:-4px;bottom:-4px;background:var(--ink);color:var(--bg);font-size:10px;font-weight:700;border-radius:999px;padding:1px 6px;z-index:2}
.note{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:13.5px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:12px}
.note.lotn{border-color:var(--ink)}
.note.grdn{border-color:var(--warn);background:var(--warn-soft)}
.picklist{max-height:260px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.picklist label{display:flex;gap:10px;align-items:center;padding:8px 10px;border-top:1px solid var(--line);cursor:pointer;font-size:13.5px}
.picklist label:first-child{border-top:0}
.picklist input{width:18px;height:18px;accent-color:var(--accent);flex-shrink:0}
.newrow{display:grid;grid-template-columns:1.1fr 1.3fr 1fr 1fr auto;gap:6px;margin-top:6px;align-items:center}
.newrow input,.newrow select{padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);min-width:0;width:100%;font-size:13.5px}
@media (max-width:520px){.newrow{grid-template-columns:1fr 1fr}.newrow .rm{grid-column:2;justify-self:end}}
.pg-slots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pg-slot{display:flex;flex-direction:column;gap:8px;align-items:stretch;text-align:center}
.pg-prev{width:100%;aspect-ratio:63/88;object-fit:contain;background:var(--surface2);border-radius:8px}
.pg-empty{display:grid;place-items:center;aspect-ratio:63/88;border:1.5px dashed var(--line);border-radius:8px;color:var(--muted);font-size:13px;cursor:pointer}
.pg-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pg-grid .full{grid-column:1/-1}
.pg-card{text-align:center;display:flex;flex-direction:column;gap:3px}
.pg-card b{font-size:16px}
.pg-map{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center;margin-top:8px}
.pg-cardimg{width:100%;border-radius:8px;border:1px solid var(--line)}
.pg-mapbox{position:relative;aspect-ratio:63/88;border:1.5px solid var(--ink);border-radius:4px;background:var(--surface)}
.pg-mapbox::before{content:"";position:absolute;inset:12%;border:1.5px dashed var(--muted)}
.pg-c{position:absolute;font-size:12px;font-weight:700;background:var(--surface);padding:0 3px}
.pg-c.t{top:4%;left:50%;transform:translateX(-50%)}.pg-c.b{bottom:4%;left:50%;transform:translateX(-50%)}
.pg-c.l{left:1%;top:50%;transform:translateY(-50%) rotate(-90deg)}.pg-c.r{right:1%;top:50%;transform:translateY(-50%) rotate(90deg)}
.pg-inner{position:absolute;inset:22% 16%;display:flex;flex-direction:column;justify-content:center;gap:4px;font-size:11.5px;text-align:center}
.pg-corners{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pg-tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:3px;text-align:center}
.pg-tile img{width:100%;max-width:150px;align-self:center;border-radius:6px}
.pg-kv{display:flex;justify-content:space-between;font-size:13px;padding:0 6px}
.pg-edges{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pg-tile.v{flex-direction:row;align-items:center;gap:10px;text-align:left}
.pg-tile.v img{width:30px;height:auto;max-width:30px}
.pg-tile.v>div{flex:1}
.trow{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-top:8px}
.trow input,.trow select{padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);min-width:0;width:100%;font-size:13.5px}
.trow .rm{justify-self:end}
.chart{position:relative;margin-top:8px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12px;box-shadow:var(--shadow);white-space:nowrap;z-index:3}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.vpick{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;min-height:40px;align-items:flex-start}
.vpick button{border:2px solid transparent;border-radius:9px;padding:2px;background:none;cursor:pointer;flex-shrink:0;width:88px;text-align:center;font-size:11px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;gap:3px;align-items:center}
.vpick button img{width:80px;aspect-ratio:63/88;object-fit:cover;border-radius:6px;display:block;background:var(--surface2)}
.cand-noimg{display:grid;place-items:center;width:80px;aspect-ratio:63/88;border-radius:6px;background:var(--surface2);color:var(--ink);font-size:11px;padding:4px;text-align:center;box-sizing:border-box}
.vpick button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.vpick .none{width:80px;aspect-ratio:63/88;border:1px dashed var(--line);border-radius:6px;display:grid;place-items:center;font-size:11px}
.check{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent)}
@media (max-width:420px){.detail-top{grid-template-columns:100px 1fr}.kv{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .2s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>
<body>

<div class="app" id="app"><div class="scroller" id="scroller"><div class="wrap">
  <header class="top">
    <div>
      <div class="brand">Treasure <span>Log</span></div>
      <div class="sub" id="subline">Inventory, sales and shows for your card table</div>
    </div>
  </header>
  <div id="status"></div>
  <main id="main"></main>

const isEx=()=>!S.exampleOff&&!S.cards.length&&!S.sales.length&&!S.shows.length&&!S.expenses.length&&!S.lots.length&&!S.items.length&&!S.supplies.length&&!S.wants.length&&!S.trades.length;

const n=v=>{const x=parseFloat(v);return isFinite(x)?x:0;};

const signed=v=>(n(v)>0?"+":"")+money(v);

const showCosts=sh=>n(sh.tableFee)+(sh.costs||[]).reduce((a,c)=>a+n(c.amt),0);
function showNumbers(sh){

  const fees=sales.reduce((a,s)=>a+n(s.fees),0);
  const bulk=n(sh.bulkRevenue);
  const costs=showCosts(sh)+exps.reduce((a,e)=>a+n(e.amount),0);
  const buyCash=buys.filter(c=>!c.dealId&&!c.tradeId).reduce((a,c)=>a+n(c.cost)*n(c.qtyBought||c.qty),0);
  const legacyTrade=buys.filter(c=>c.dealId&&!c.tradeId).reduce((a,c)=>a+n(c.cost)*n(c.qtyBought||c.qty),0);
  const tradeIn=legacyTrade+D("trades").filter(t=>t.showId===sh.id).reduce((a,t)=>a+n(t.valueIn),0);
  const net=rev-cogs-fees+bulk-costs;
  return {sales,exps,buys,rev,cogs,fees,bulk,costs,buyCash,tradeIn,net,cashIn:rev+bulk-legacyTrade,units:sales.reduce((a,s)=>a+n(s.qty),0)};
}
function compStats(c){
  const all=(c.comps||[]).filter(x=>n(x.price)>0);
  const sold=all.filter(x=>x.kind!=="listed");
  const cutoff=ago(S.settings.compDays||90);
  let use=sold.filter(x=>(x.date||"")>=cutoff);
  if(!use.length)use=sold;
  const p=use.map(x=>n(x.price)).sort((a,b)=>a-b);
  if(!p.length)return{n:0,listedN:all.length-sold.length,listedLow:lowListed(all)};
  const mean=p.reduce((a,b)=>a+b,0)/p.length;
  const mid=Math.floor(p.length/2);
  const median=p.length%2?p[mid]:(p[mid-1]+p[mid])/2;
  let trimmed=mean;
  if(p.length>=5){const k=Math.floor(p.length*.1)||1;const tp=p.slice(k,p.length-k);trimmed=tp.reduce((a,b)=>a+b,0)/tp.length;}
  const newest=use.map(x=>x.date||"").sort().pop();
  return{n:p.length,mean,median,trimmed,low:p[0],high:p[p.length-1],newest,listedN:all.length-sold.length,listedLow:lowListed(all)};
}
function lowListed(all){const l=all.filter(x=>x.kind==="listed").map(x=>n(x.price));return l.length?Math.min(...l):null;}
function niceRound(v){v=n(v);if(v<=0)return 0;if(v<5)return Math.round(v*4)/4;if(v<20)return Math.round(v);if(v<100)return Math.round(v/5)*5;if(v<500)return Math.round(v/10)*10;return Math.round(v/25)*25;}
const suggestList=m=>niceRound(n(m)*(1+n(S.settings.markupPct)/100));
const offerFor=m=>Math.floor(n(m)*n(S.settings.offerPct)/100);
function lastCompDate(c){return (c.comps||[]).map(x=>x.date||"").sort().pop()||c.marketDate||"";}
const PHOTO_URLS={};
function blobUrl(id){return PHOTO_URLS[id]||"/_blob/"+id;}
function photoSrc(c){if(c.photoId)return blobUrl(c.photoId);if(c.photoUrl)return c.photoUrl;return null;}
function imgSrc(c){if(c.officialImg&&CAN_OFFICIAL)return c.officialImg;return photoSrc(c);}
/* official card pictures (standalone app only: the Claude viewer blocks outside images) */
const CAN_OFFICIAL=!!window.TL_STANDALONE;
const OFFICIAL={EN:"https://en.onepiece-cardgame.com/images/cardlist/card/",JP:"https://www.onepiece-cardgame.com/images/cardlist/card/"};
const codeOk=c=>/^[A-Z]{1,5}\d{0,2}-\d{3}$/.test(String(c||"").trim().toUpperCase());
const officialUrl=(code,lang,suf)=>OFFICIAL[lang==="JP"?"JP":"EN"]+encodeURIComponent(String(code).trim().toUpperCase())+(suf||"")+".png";
function probeImg(url){return new Promise(res=>{const i=new Image();let done=false;const fin=v=>{if(!done){done=true;clearTimeout(t);res(v);}};const t=setTimeout(()=>fin(false),9000);i.referrerPolicy="no-referrer";i.onload=()=>fin(i.naturalWidth>10);i.onerror=()=>fin(false);i.src=url+(url.includes("?")?"&":"?")+"probe=1";});}
const VCACHE={};
async function findVersions(code,lang){
  const key=code+"|"+lang;if(VCACHE[key])return VCACHE[key];
  const sufs=["","_p1","_p2","_p3","_p4","_p5","_p6","_p7","_p8"];
  const tryLang=async L=>(await Promise.all(sufs.map(async s=>{const u=officialUrl(code,L,s);return (await probeImg(u))?{suf:s,url:u,lang:L}:null;}))).filter(Boolean);
  let v=await tryLang(lang),other=false;
  if(!v.length){v=await tryLang(lang==="JP"?"EN":"JP");other=v.length>0;}
  const out={v,other};if(v.length)VCACHE[key]=out;return out;
}
function linkToImage(u){
  u=String(u||"").trim();const found=u.match(/https?:\/\/\S+/i);if(found)u=found[0].replace(/[)\].,]+$/,"");
  const m=u.match(/tcgplayer\.com\/product\/(\d+)/i);if(m)return`https://tcgplayer-cdn.tcgplayer.com/product/${m[1]}_in_1000x1000.jpg`;
  if(/^https:\/\/tcgplayer-cdn\.tcgplayer\.com\/product\/\d+/i.test(u))return u.split("?")[0];
  if(/^https:\/\/\S+\.(jpe?g|png|webp|gif)(\?\S*)?$/i.test(u))return u;
  return null;
}
function linkBox(id){return`<div class="bar" style="margin-top:6px"><span class="hint">Get a picture from:</span><button type="button" class="btn sm" data-site="tcg" data-for="${id}">TCGplayer ↗</button><button type="button" class="btn sm" data-site="pc" data-for="${id}">PriceCharting ↗</button><button type="button" class="btn sm" data-site="img" data-for="${id}">Google Images ↗</button></div>
  <div class="bar" style="margin-top:6px"><button type="button" class="btn sm pri" data-paste="${id}">Paste picture or link</button><input id="${id}" class="search" type="url" inputmode="url" placeholder="…or paste a link here" aria-label="Picture link" style="min-width:0"><button type="button" class="btn sm" data-linkfor="${id}">Use</button></div>
  <span class="hint" id="${id}-st">On the site, long-press the card picture and tap Copy, or tap Share → Copy for the page link. Then come back and tap Paste.</span>`;}
function siteSearchUrl(site,code,name,lang){
  const base=[code&&!/DON$/i.test(code)?code:"",name].filter(Boolean).join(" ").trim();
  if(site==="tcg")return`https://www.tcgplayer.com/search/one-piece-card-game/product?q=${encodeURIComponent(base)}`;
  if(site==="pc")return`https://www.pricecharting.com/search-products?q=${encodeURIComponent("one piece "+base)}&type=prices`;
  return`https://www.google.com/search?tbm=isch&q=${encodeURIComponent("one piece card "+base+(lang==="JP"?" japanese":""))}`;
}
async function useLink(inputId,onOk){
  const inp=document.getElementById(inputId),st=document.getElementById(inputId+"-st");const url=linkToImage(inp.value);
  if(!url&&/pricecharting\.com/i.test(inp.value)){st.textContent="PriceCharting page links can't be read by the app. Take a screenshot of the card instead, then use \"Photo of the card\" → Photo Library.";return;}
  if(!url){st.textContent="That link doesn't lead to a picture. Use a TCGplayer card page link, or copy the picture itself (long-press → Copy).";return;}
  st.textContent="Checking the picture…";
  if(!(await probeImg(url))){st.textContent="Couldn't load a picture from that link.";return;}
  st.textContent="Picture set.";onOk(url);
}
async function pasteClipboard(inputId,onUrl,onBlob){
  const st=document.getElementById(inputId+"-st");
  try{
    if(navigator.clipboard&&navigator.clipboard.read){
      const items=await navigator.clipboard.read();
      for(const it of items){const t=it.types.find(x=>x.startsWith("image/"));if(t){st.textContent="Saving the picture…";const blob=await shrink(await it.getType(t));st.textContent="Picture set.";onBlob(blob);return;}}
      for(const it of items){if(it.types.includes("text/plain")){const txt=await (await it.getType("text/plain")).text();document.getElementById(inputId).value=txt.trim();return useLink(inputId,onUrl);}}
      st.textContent="Nothing to paste. Copy the picture or the page link first.";return;
    }
    if(navigator.clipboard&&navigator.clipboard.readText){const txt=await navigator.clipboard.readText();document.getElementById(inputId).value=txt.trim();return useLink(inputId,onUrl);}
    st.textContent="Your browser won't let the app read the clipboard. Long-press the link box and tap Paste.";
  }catch(e){st.textContent="Couldn't read what you copied. Long-press the link box, tap Paste, then Use.";}
}
/* ctx() -> {code,name,lang}; onUrl(url); onBlob(blob) */
function wireLinkBox(id,ctx,onUrl,onBlob){
  document.querySelectorAll(`[data-for="${id}"]`).forEach(b=>b.onclick=()=>{const c=ctx();const u=siteSearchUrl(b.dataset.site,c.code,c.name,c.lang);const w=window.open(u,"_blank","noopener");if(!w)location.href=u;});
  const pb=document.querySelector(`[data-paste="${id}"]`);if(pb)pb.onclick=()=>pasteClipboard(id,onUrl,onBlob);
  const ub=document.querySelector(`[data-linkfor="${id}"]`);if(ub)ub.onclick=()=>useLink(id,onUrl);
}
const vLabel=s=>s?"Version "+s.replace("_",""):"Regular";
/* renders the version strip; onPick({suf,url}|null) */
async function mountPicker(el,code,lang,selected,onPick){
  code=String(code||"").trim().toUpperCase();
  if(!codeOk(code)){el.innerHTML=`<span class="hint">${code?"The official list has no pictures for this code. Get one from another site below.":"Type a card code like OP05-119 to see its versions."}</span>`;return;}
  el.innerHTML=`<span class="hint">Looking up ${esc(code)} on the official card list…</span>`;
  const token=(el._tok=(el._tok||0)+1);
  let res;try{res=await findVersions(code,lang);}catch(e){res={v:[],other:false};}
  if(el._tok!==token)return;
  if(!res.v.length){el.innerHTML=`<span class="hint">No official picture found for ${esc(code)}${navigator.onLine===false?" (you're offline)":""}. New cards and some promos aren't listed yet. Get one from another site below, or use your own photo.</span>`;return;}
  el.innerHTML=(res.other?`<span class="hint" style="align-self:center;width:90px;flex-shrink:0">Only on the ${res.v[0].lang==="JP"?"Japanese":"English"} site:</span>`:"")+res.v.map((x,k)=>`<button type="button" data-k="${k}" aria-pressed="${x.url===selected}"><img src="${esc(x.url)}" alt="${esc(code)} ${esc(vLabel(x.suf))}" referrerpolicy="no-referrer" loading="lazy">${esc(vLabel(x.suf))}</button>`).join("")+`<button type="button" data-k="none" aria-pressed="${!selected}"><span class="none">✕</span>No picture</button>`;
  el.querySelectorAll("button").forEach(b=>b.onclick=()=>{el.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed","false"));b.setAttribute("aria-pressed","true");onPick(b.dataset.k==="none"?null:res.v[+b.dataset.k]);});
}
function thumb(c,cls2){const s=imgSrc(c);return s?`<img class="${cls2||"thumb"}" src="${esc(s)}" alt="${esc(c.name||c.code)}" loading="lazy" referrerpolicy="no-referrer">`:`<div class="${cls2||"thumb"}">${esc(c.code||"?")}</div>`;}
function gradeLabel(c){return c.kind==="graded"?`${c.grader||"Graded"} ${c.grade||""}`.trim():(c.cond||"Raw");}
function chips(c){
  let h=`<span class="chip ${c.lang==="JP"?"jp":""}">${esc(c.lang||"EN")}</span>`;
  h+=`<span class="chip ${c.kind==="graded"?"gr":""}">${esc(gradeLabel(c))}</span>`;
  if(c.variant&&c.variant!=="Regular")h+=`<span class="chip">${esc(c.variant)}</span>`;
  if(c.rarity)h+=`<span class="chip">${esc(c.rarity)}</span>`;
  if(c.status==="grading")h+=`<span class="chip grd">At ${esc((c.grading||{}).company||"grading")} · ${daysSince((c.grading||{}).sent)??0}d</span>`;
  const L=cardLot(c);if(L)h+=`<span class="chip lot">${esc(shortLot(L))}</span>`;
  return h;
}
/* ---------- lots ---------- */
function cardLot(c){if(!c||!c.lotId)return null;return byId("lots",c.lotId)||null;}
const shortLot=L=>String(L.name||"Lot").split("·")[0].trim();
const lotCards=L=>D("cards").filter(c=>c.lotId===L.id);
function certsSequential(cards){
  if(cards.length<2)return false;
  if(!cards.every(c=>c.kind==="graded"&&/^\d+$/.test(String(c.cert||"").trim())))return false;
  if(new Set(cards.map(c=>c.grader)).size>1)return false;
  const nums=cards.map(c=>Number(c.cert)).sort((a,b)=>a-b);
  return nums.every((v,i)=>i===0||v-nums[i-1]===1);
}
function lotStats(L){
  const cards=lotCards(L);
  const units=cards.reduce((a,c)=>a+n(c.qty),0);
  const cost=cards.reduce((a,c)=>a+n(c.qty)*n(c.cost),0);
  const missing=cards.filter(c=>!(n(c.market)>0)).length;
  const base=cards.reduce((a,c)=>a+n(c.qty)*(n(c.market)||n(c.cost)),0);
  const prem=n(L.premiumPct);
  const whole=n(L.market)>0;
  const value=whole?n(L.market):base*(1+prem/100);
  const sticker=n(L.list)||suggestList(value);
  const seqCerts=certsSequential(cards);
  const langs=[...new Set(cards.map(c=>c.lang))];
  const grades=[...new Set(cards.map(c=>gradeLabel(c)))];
  return{cards,units,cost,missing:whole?0:missing,base,prem,value,whole,sticker,seqCerts,langs,grades};
}
function lotQuery(L){
  const st=lotStats(L);const nm=String(L.name||"").replace(/^lot\s*\d+\s*[·:\-]?\s*/i,"").trim();
  return ["one piece",nm||st.cards.slice(0,3).map(c=>c.name||c.code).join(" "),st.grades.length===1&&st.cards[0]&&st.cards[0].kind==="graded"?st.grades[0]:"",st.langs.length===1&&st.langs[0]==="JP"?"japanese":"","lot"].filter(Boolean).join(" ");
}
function lotCompsBlock(L){
  const cs=compStats(L);const q=lotQuery(L);
  const comps=[...(L.comps||[])].map((x,i)=>({...x,i})).sort((a,b)=>(b.date||"")>(a.date||"")?1:-1);
  return `<div class="section"><div class="bar spread"><h3 style="margin:0">Comps for the whole lot</h3>${cs.n?`<span class="hint">${cs.n} sold · newest ${fdate(cs.newest)}</span>`:""}</div>

function searchQuery(c,site){

  if(c.kind==="graded"&&site!=="yuyu")parts.push((c.grader||"")+" "+(c.grade||""));

/* ---------- storage ---------- */
function stripId(o){const x={...o};delete x.id;return x;}
async function put(col,obj){
  obj.updatedAt=new Date().toISOString();
  if(!obj.createdAt)obj.createdAt=obj.updatedAt;
  if(S.db){
    try{
      if(obj.id){await S.db.collection(col).doc(obj.id).set(stripId(obj));return obj.id;}
      const ref=await S.db.collection(col).add(stripId(obj));return ref.id;
    }catch(e){toast("Couldn't save: "+(e.message||e.code||"try again"));throw e;}
  }
  if(!obj.id){obj.id=Date.now().toString(36)+Math.random().toString(36).slice(2,8);S[col].push(obj);}
  else{const i=S[col].findIndex(x=>x.id===obj.id);if(i>=0)S[col][i]=obj;else S[col].push(obj);}
  if(S.idb){try{await IDB.put(col,obj.id,obj);}catch(e){toast("Couldn't save on this phone: "+(e.message||e));throw e;}}
  render();return obj.id;
}
async function del(col,id){
  if(S.db){try{await S.db.collection(col).doc(id).delete();}catch(e){toast("Couldn't delete: "+(e.message||e.code));throw e;}return;}
  S[col]=S[col].filter(x=>x.id!==id);
  if(S.idb){try{await IDB.del(col,id);}catch(e){toast("Couldn't delete on this phone");}}
  render();
}
async function saveSettings(){
  if(S.db){try{await S.db.doc("settings/main").set({...S.settings});}catch(e){toast("Couldn't save settings");}}
  if(S.idb){try{await IDB.put("settings","main",{...S.settings});}catch(e){toast("Couldn't save settings");}}
  render();
}

/* ---------- on-device storage (standalone app) ---------- */
const IDB={db:null,
  open(){return new Promise((res,rej)=>{let r;try{r=indexedDB.open("treasure-log",2);}catch(e){rej(e);return;}
    r.onupgradeneeded=()=>{const d=r.result;[...COLS,"settings","photos"].forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s);});};
    r.onsuccess=()=>{IDB.db=r.result;res(r.result);};r.onerror=()=>rej(r.error);});},
  tx(store,mode,fn){return new Promise((res,rej)=>{const t=IDB.db.transaction(store,mode);const r=fn(t.objectStore(store));let out;if(r)r.onsuccess=()=>{out=r.result;};t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);});},
  put(s,k,v){return IDB.tx(s,"readwrite",st=>st.put(v,k));},
  get(s,k){return IDB.tx(s,"readonly",st=>st.get(k));},
  del(s,k){return IDB.tx(s,"readwrite",st=>st.delete(k));},
  clear(s){return IDB.tx(s,"readwrite",st=>st.clear());},
  all(s){return new Promise((res,rej)=>{const out=[];const c=IDB.db.transaction(s).objectStore(s).openCursor();c.onsuccess=()=>{const cur=c.result;if(cur){out.push([cur.key,cur.value]);cur.continue();}else res(out);};c.onerror=()=>rej(c.error);});}
};
const localAssets={async upload(blob){const id="p"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);await IDB.put("photos",id,blob);PHOTO_URLS[id]=URL.createObjectURL(blob);return{id,url:PHOTO_URLS[id]};}};
function fileFor(filename,data){return data instanceof Blob?new File([data],filename,{type:data.type}):new File([data],filename,{type:filename.endsWith(".json")?"application/json":"text/csv"});}
const localDownloads={async save({filename,data}){
  const file=fileFor(filename,data);
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:filename});return{status:"saved"};}}
  catch(e){if(e&&e.name==="AbortError"){const err=new Error("declined");err.code="declined";throw err;}}
  const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000);return{status:"saved"};
}};
function getApiKey(){try{return localStorage.getItem("tl-apikey")||"";}catch(e){return"";}}
function blobToB64(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result));r.onerror=()=>rej(r.error);r.readAsDataURL(b);});}
function dataUrlToBlob(u){const [head,b64]=String(u).split(",");const type=(head.match(/data:([^;]+)/)||[])[1]||"application/octet-stream";const bin=atob(b64||"");const arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return new Blob([arr],{type});}
function parseLooseJson(t){t=String(t).trim();try{return JSON.parse(t);}catch(_){}const f=t.match(/```(?:json)?\s*([\s\S]*?)```/);if(f){try{return JSON.parse(f[1]);}catch(_){}}const a=t.search(/[\[{]/),b=Math.max(t.lastIndexOf("]"),t.lastIndexOf("}"));if(a>=0&&b>a){try{return JSON.parse(t.slice(a,b+1));}catch(_){}}const e=new Error("invalid_json");e.code="invalid_json";throw e;}
function apiSample(key){
  const call=async(prompt,opts)=>{
    const content=[];
    for(const img of ((opts&&opts.images)||[])){const d=await blobToB64(img);content.push({type:"image",source:{type:"base64",media_type:img.type||"image/jpeg",data:d.split(",")[1]}});}
    content.push({type:"text",text:prompt});
    let r;
    try{r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-haiku-4-5-20251001",max_tokens:4000,messages:[{role:"user",content}]})});}
    catch(e){const err=new Error("offline");err.code="unavailable";throw err;}
    if(r.status===401||r.status===403){const err=new Error("bad key");err.code="bad_key";throw err;}
    if(r.status===429){const err=new Error("rate");err.code="rate_limited";throw err;}
    if(!r.ok){const err=new Error("api "+r.status);err.code="unavailable";throw err;}
    const j=await r.json();return (j.content||[]).filter(x=>x.type==="text").map(x=>x.text).join("");
  };
  const f=async(p,o)=>({text:await call(p,o)});
  f.json=async(p,o)=>parseLooseJson(await call(p,o));
  return f;
}
function useApiKey(){const k=getApiKey();S.sample=k?apiSample(k):null;S.sampleImg=!!k;}

async function buildBackup(){
  const ids=new Set([...S.cards,...S.items].map(x=>x.photoId).filter(Boolean));
  const photos={};let missed=0;
  for(const id of ids){try{const blob=S.idb?await IDB.get("photos",id):await (await fetch(blobUrl(id))).blob();if(blob)photos[id]=await blobToB64(blob);else missed++;}catch(e){missed++;}}
  const settings={...S.settings};delete settings.lastBackup;
  const data={app:"treasure-log",version:1,exportedAt:new Date().toISOString(),exportedDate:today(),settings,collections:Object.fromEntries(COLS.map(c=>[c,S[c]])),photos};
  return{json:JSON.stringify(data),missed,counts:COLS.map(c=>[c,S[c].length])};
}
async function restoreBackup(b,progress){
  const cols=b.collections||{};const idMap={};
  if(S.idb){await IDB.clear("photos");Object.keys(PHOTO_URLS).forEach(k=>{try{URL.revokeObjectURL(PHOTO_URLS[k]);}catch(_){}delete PHOTO_URLS[k];});}
  const pics=Object.entries(b.photos||{});let k=0;
  for(const [pid,u] of pics){progress(`Photos ${++k}/${pics.length}`);try{const r=await S.assets.upload(dataUrlToBlob(u),{type:"image/jpeg"});idMap[pid]=r.id;}catch(e){}}
  for(const col of ["cards","items"])(cols[col]||[]).forEach(x=>{if(x.photoId){if(idMap[x.photoId])x.photoId=idMap[x.photoId];else delete x.photoId;}delete x.photoUrl;});
  for(const col of COLS){
    const docs=(cols[col]||[]).filter(d=>d&&d.id);
    progress(`Restoring ${col}…`);
    if(S.db){for(const d of [...S[col]])await S.db.collection(col).doc(d.id).delete();for(const d of docs)await S.db.collection(col).doc(d.id).set(stripId(d));}
    else if(S.idb){await IDB.clear(col);for(const d of docs)await IDB.put(col,d.id,d);S[col]=docs;}
    else S[col]=docs;
  }
  S.settings={...DEFAULT_SETTINGS,...(b.settings||{}),lastBackup:today()};await saveSettings();
  S.exampleOff=true;
}

function stockCards(){return D("cards").filter(c=>c.status!=="sold"&&n(c.qty)>0);}
function totals(){
  const st=stockCards().filter(c=>c.status!=="pc");
  const units=st.reduce((a,c)=>a+n(c.qty),0);
  const cost=st.reduce((a,c)=>a+n(c.qty)*n(c.cost),0);
  const loose=st.filter(c=>!cardLot(c));
  const withMkt=loose.filter(c=>n(c.market)>0);
  const lots=openLots();
  const mkt=loose.reduce((a,c)=>a+n(c.qty)*(n(c.market)||n(c.cost)),0)+lots.reduce((a,L)=>a+lotStats(L).value,0);
  const grading=st.filter(c=>c.status==="grading");
  const inv=D("items").filter(i=>n(i.qty)>0);
  const itemCost=inv.reduce((a,i)=>a+n(i.qty)*n(i.cost),0),itemVal=inv.reduce((a,i)=>a+n(i.qty)*n(i.price),0);
  const salesP=D("sales").reduce((a,s)=>a+saleProfit(s),0);
  const itemP=D("sales").filter(s=>s.itemId).reduce((a,s)=>a+saleProfit(s),0);
  const bulk=D("shows").reduce((a,s)=>a+n(s.bulkRevenue),0);
  const showC=D("shows").filter(s=>(s.date||"")<=today()).reduce((a,s)=>a+showCosts(s),0);
  const exps=D("expenses").reduce((a,e)=>a+n(e.amount),0);
  const realized=salesP+bulk-showC-exps;
  const m=today().slice(0,7);
  const mSales=D("sales").filter(s=>(s.date||"").startsWith(m));
  const mReal=mSales.reduce((a,s)=>a+saleProfit(s),0)+D("shows").filter(s=>(s.date||"").startsWith(m)&&s.date<=today()).reduce((a,s)=>a+n(s.bulkRevenue)-showCosts(s),0)-D("expenses").filter(e=>(e.date||"").startsWith(m)).reduce((a,e)=>a+n(e.amount),0);
  return{units,lines:loose.length+lots.length,lotsN:lots.length,gradingN:grading.length,itemUnits:inv.reduce((a,i)=>a+n(i.qty),0),cost:cost+itemCost,mkt:mkt+itemVal,unreal:mkt+itemVal-cost-itemCost,itemP,cardP:salesP-itemP,missing:loose.length-withMkt.length,realized,mReal,salesP,bulk,showC,exps,rev:D("sales").reduce((a,s)=>a+saleRev(s),0)+bulk};
}

function filteredItems(){

    if(!ok||!matchCard(c,words))return;
    items.push({t:"card",o:c,created:c.createdAt||"",value:n(c.market)*n(c.qty),cost:n(c.cost)*n(c.qty),units:n(c.qty),buy:c.buyDate||"",code:String(c.code||"")});
  });
  D("lots").forEach(L=>{

}

function render(){
  const tabs=document.getElementById("tabs");
  tabs.innerHTML=TABS.map(([k,l])=>`<button data-act="tab" data-v="${k}" ${S.tab===k?'aria-current="page"':""}>${ICONS[k]}<span>${l}</span></button>`).join("");
  const st=document.getElementById("status");
  let b="";
  if(isEx())b+=`<div class="banner"><span><b>Example data.</b> These cards and shows are samples so you can look around. They disappear when you log your first real card.</span><button class="btn sm" data-act="hide-ex">Start empty</button></div>`;
  if(S.loaded&&!S.live)b+=window.TL_STANDALONE?`<div class="banner"><span>This browser won't let the app save data. Open it in Safari (not a private tab) and add it to your home screen.</span></div>`:`<div class="banner"><span>Saving isn't available in this view, so changes last only until you close the page. Open it in Claude to keep your log.</span></div>`;
  if(window.TL_STANDALONE&&S.live){
    const installed=navigator.standalone===true||(window.matchMedia&&matchMedia("(display-mode: standalone)").matches);
    let hideInstall=false;try{hideInstall=localStorage.getItem("tl-hide-install")==="1";}catch(_){}
    if(!installed&&!hideInstall)b+=`<div class="banner"><span><b>Install it:</b> in Safari tap Share, then <b>Add to Home Screen</b>. It opens full-screen and works offline.</span><button class="btn sm" data-act="hide-install">Got it</button></div>`;
    const hasData=S.cards.length||S.sales.length||S.items.length;const lb=S.settings.lastBackup;const age=lb?daysSince(lb):null;
    if(hasData&&(age===null||age>=7))b+=`<div class="banner"><span>Your log is only on this phone. Last backup: <b>${lb?age+" days ago":"never"}</b>.</span><button class="btn sm" data-act="tab" data-v="tools">Back up now</button></div>`;
  }
  st.innerHTML=b;
  const fab=document.querySelector(".fab");if(fab)fab.hidden=S.tab==="grade";
  const main=document.getElementById("main");
  const focusQ=document.activeElement&&document.activeElement.id==="q";
  main.innerHTML=({home:vHome,cards:vCards,items:vItems,grade:vGrade,shows:vShows,money:vMoney,tools:vTools}[S.tab]||vHome)();
  if(S.tab==="cards"){const s=document.getElementById("sort");if(s)s.value=S.sort;if(focusQ){const q=document.getElementById("q");q.focus();q.setSelectionRange(q.value.length,q.value.length);}}
  if(S.tab==="tools")calc();
  if(S.sheet&&S.sheet.live)openSheet(S.sheet.type,S.sheet.arg,true);
  scheduleSnapshot();
}

/* ---------- daily inventory snapshots (for the value chart) ---------- */
let snapT;
function scheduleSnapshot(){clearTimeout(snapT);snapT=setTimeout(takeSnapshot,1500);}
async function takeSnapshot(){
  if(!S.live||isEx()||(!S.cards.length&&!S.items.length))return;
  if(S.db&&Date.now()-S.bootAt<5000){scheduleSnapshot();return;}
  const t=totals();const snap={id:today(),date:today(),value:r2(t.mkt),cost:r2(t.cost),realized:r2(t.realized)};
  const cur=S.snapshots.find(x=>x.id===snap.id);
  if(cur&&cur.value===snap.value&&cur.cost===snap.cost&&cur.realized===snap.realized)return;
  try{await put("snapshots",snap);}catch(_){}
}

function openSheet(type,arg,refresh){
  const f=SHEETS[type];if(!f)return;
  const out=f(arg);if(!out)return;
  const root=document.getElementById("sheetRoot");
  const prevScroll=refresh&&root.querySelector(".sheet")?root.querySelector(".sheet").scrollTop:0;
  S.sheet={type,arg,live:!!out.live};
  root.innerHTML=`<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(out.title)}"><div class="sheet-head"><h3>${out.title}</h3><button class="x" data-act="close" aria-label="Close">×</button></div>${out.body}</div></div>`;
  if(refresh)root.querySelector(".sheet").scrollTop=prevScroll;
  if(out.after)out.after();
  if(!refresh)document.body.style.overflow="hidden";
}
function closeSheet(){document.getElementById("sheetRoot").innerHTML="";S.sheet=null;S.pendingPhoto=null;document.body.style.overflow="";}

/* ---------- comp text parser (fallback when Claude isn't available) ---------- */
const MONTHS={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,sept:9,oct:10,nov:11,dec:12};
function yearFor(mo,da){const t=new Date();let y=t.getFullYear();const d=new Date(y,mo-1,da);if(d.getTime()-t.getTime()>2*864e5)y--;return y;}
function isoOf(y,mo,da){if(!(mo>=1&&mo<=12&&da>=1&&da<=31))return null;return `${y}-${String(mo).padStart(2,"0")}-${String(da).padStart(2,"0")}`;}
function findDate(line){
  let m=line.match(/\b(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.?\s+(\d{1,2})(?:st|nd|rd|th)?,?\s+(\d{4})/i);
  if(m)return isoOf(m[3],MONTHS[m[1].toLowerCase().slice(0,3)],+m[2]);
  m=line.match(/\b(\d{1,2})\s+(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.?,?\s+(\d{4})/i);
  if(m)return isoOf(m[3],MONTHS[m[2].toLowerCase().slice(0,3)],+m[1]);
  m=line.match(/\b(\d{4})-(\d{1,2})-(\d{1,2})\b/);if(m)return isoOf(m[1],+m[2],+m[3]);
  m=line.match(/\b(\d{4})\/(\d{1,2})\/(\d{1,2})\b/);if(m)return isoOf(m[1],+m[2],+m[3]);
  m=line.match(/\b(\d{1,2})\/(\d{1,2})\/(\d{2,4})\b/);if(m){const y=m[3].length===2?"20"+m[3]:m[3];return isoOf(y,+m[1],+m[2]);}
  m=line.match(/\b(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.?\s+(\d{1,2})\b(?!\s*,?\s*\d{4})/i);
  if(m){const mo=MONTHS[m[1].toLowerCase().slice(0,3)];return isoOf(yearFor(mo,+m[2]),mo,+m[2]);}
  m=line.match(/(?:^|\s)(\d{1,2})\/(\d{1,2})(?:\s|$)/);if(m)return isoOf(yearFor(+m[1],+m[2]),+m[1],+m[2]);
  return null;
}
/* finds a price in a line: $70, $ 70.00, US $70, USD 70, 70.00 USD, ¥7,000 is skipped */
function findPrice(line){
  const clean=line.replace(/ /g," ");
  let m=clean.match(/(?:US\s*)?\$\s?(\d{1,3}(?:,\d{3})+(?:\.\d{1,2})?|\d+(?:\.\d{1,2})?)/i)||clean.match(/\bUSD\s?(\d{1,3}(?:,\d{3})+(?:\.\d{1,2})?|\d+(?:\.\d{1,2})?)/i)||clean.match(/(\d{1,3}(?:,\d{3})+(?:\.\d{1,2})?|\d+(?:\.\d{1,2})?)\s?USD\b/i);
  return m?n(m[1].replace(/,/g,"")):0;
}
function parseCompsText(text){
  const out=[];let date=null,title="";
  const lines=String(text).replace(/\r/g,"").split(/\n+/).map(l=>l.trim()).filter(Boolean);
  lines.forEach(line=>{
    const d=findDate(line);if(d)date=d;
    if(/shipping|delivery|postage|\+\s*\$|was:|list price|or best offer|coupon|free returns/i.test(line)&&!/sold/i.test(line)){if(!/\$/.test(line))title=line;return;}
    if(/\bto\b\s*\$|\$\s?[\d.,]+\s*(?:-|–|to)\s*\$/i.test(line))return;
    const price=findPrice(line);
    if(price>0)out.push({price,date:date||today(),title:line.replace(/(?:US\s*)?\$\s?[\d.,]+|\d{4}-\d{1,2}-\d{1,2}/g,"").trim().length>12?line:(title||line),kind:/sold/i.test(line+" "+title)||d||date?"sold":"listed",match:true});
    else if(line.length>18&&!d)title=line;
  });
  if(out.length)return out;
  /* quick typing: one sale per line, like "70 9/9" or "54.99 Jul 15" or just "41" */
  lines.forEach(line=>{
    const m=line.match(/^\$?\s?(\d+(?:\.\d{1,2})?)\b\s*(.*)$/);if(!m)return;
    const price=n(m[1]);if(!(price>0))return;
    out.push({price,date:findDate(m[2]||"")||today(),title:"Typed in",kind:"sold",match:true});
  });
  return out;
}

function shrink(file){return new Promise((res,rej)=>{const img=new Image();const u=URL.createObjectURL(file);img.onload=()=>{const max=900;let w=img.naturalWidth,h=img.naturalHeight;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);const cv=document.createElement("canvas");cv.width=w;cv.height=h;cv.getContext("2d").drawImage(img,0,0,w,h);cv.toBlob(b=>{URL.revokeObjectURL(u);b?res(b):rej(new Error("encode"));},"image/jpeg",.84);};img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("load"));};img.src=u;});}

    const tradeId=isTrade?"t"+Date.now().toString(36)+Math.random().toString(36).slice(2,5):"";
    const meta={fees:0,channel:showId?"Show":(isTrade?"Trade":"Other"),showId,date,pay:isTrade?(cashNet>0?g("pay")+" + trade":"Trade"):g("pay"),dealId:"d"+Date.now().toString(36)};
    if(tradeId)meta.tradeId=tradeId;
    const weights=cart.map(x=>(isTrade?x.value:x.sticker)*x.qty);const wSum=weights.reduce((a,b)=>a+b,0);
    const cashIn=Math.max(0,cashNet);let left=cashIn;
    for(let k=0;k<cart.length;k++){const x=cart[k];
      let share=wSum>0?cashIn*weights[k]/wSum:cashIn/cart.length;share=r2(share);if(k===cart.length-1)share=r2(left);left-=share;
      const lineCost=x.cost*x.qty;const realizedCost=lineCost*m.soldFrac;
      const extra=isTrade?{costEach:r2(realizedCost/x.qty),tradeValue:r2(x.value*x.qty),basisMoved:r2(lineCost-realizedCost)}:{};
      const mm={...meta,...extra};
      if(x.t==="card"){const c=byId("cards",x.id);if(c)await sellCardCore(c,x.qty,share/x.qty,mm);}
      else if(x.t==="lot"){const L=byId("lots",x.id);if(L)await sellLotCore(L,share,mm);}
      else if(x.t==="item"){const i=byId("items",x.id);if(i)await sellItemCore(i,x.qty,share/x.qty,mm);}
    }
    const ids=[];let lotId="";
    if(isTrade){
      if(rows.some(x=>x.set))lotId=await put("lots",{name:g("lotName")||("Lot "+(D("lots").length+1)),sequential:false,premiumPct:0,status:"stock",location:"",buyDate:date,tradeId,notes:"From a trade"});
      const vSum=valueIn;let bLeft=m.basisIn;
      for(let k=0;k<rows.length;k++){const x=rows[k];
        let basis=vSum>0?m.basisIn*x.val/vSum:m.basisIn/rows.length;basis=r2(basis);if(k===rows.length-1)basis=r2(bLeft);bLeft-=basis;
        const graded=!!x.grader;
        const cid=await put("cards",{code:x.code,name:x.name,variant:"Regular",lang:x.lang,kind:graded?"graded":"raw",grader:x.grader,grade:graded?x.grade:"",cond:graded?"":(CONDS.includes(x.grade.toUpperCase())?x.grade.toUpperCase():"NM"),cert:"",qty:1,qtyBought:1,cost:basis,market:x.val||null,marketDate:x.val?today():"",buyDate:date,source:"Trade",showId,status:"stock",tradeId,lotId:x.set?lotId:"",comps:[]});
        ids.push(cid);
      }
      await put("trades",{id:tradeId,date,showId,give:cart.map(x=>({t:x.t,id:x.id,label:x.label,qty:x.qty,value:r2(x.value*x.qty),cost:r2(x.cost*x.qty)})),get:ids,lotId,cashNet:r2(cashNet),valueOut:r2(valueOut),valueIn:r2(valueIn),basisIn:r2(m.basisIn),realized:r2(m.realized),note:g("note"),pay:g("pay")});
    }
    S.dealCart=null;closeSheet();
    const change=valueIn+cashNet-valueOut;
    toast(isTrade?`Trade saved · value ${signed(change)}${cashNet>0?" · collect "+money(cashNet):cashNet<0?" · pay "+money(-cashNet):""}`:`Sale saved · collect ${money(cashNet)}`);
    if(isTrade)openSheet("trade",tradeId);else if(showId&&byId("shows",showId))openSheet("show",showId);
  }else if(t==="apikey"){
    const k=g("key");if(!k)return;try{localStorage.setItem("tl-apikey",k);}catch(_){toast("Couldn't save the key");return;}useApiKey();toast("Key saved. Photo reading is on.");render();
  }else if(t==="settings"){
    ["offerPct","markupPct","seqPremiumPct","ebayFeePct","compDays","staleDays","agingDays"].forEach(k=>{const v=g(k);if(v!=="")S.settings[k]=n(v);});
    await saveSettings();toast("Defaults saved");
  }
  }catch(err){}finally{if(btn&&btn.isConnected)btn.disabled=false;}
});

/* ---------- sell helpers (used by deals and side items) ---------- */
async function sellCardCore(c,qty,priceEach,meta){
  const sale={cardId:c.id,code:c.code,name:c.name,variant:c.variant,lang:c.lang,kind:c.kind,grader:c.grader||"",grade:c.grade||"",qty,price:Math.round(priceEach*100)/100,costEach:n(c.cost),...meta};
  await put("sales",sale);const left=n(c.qty)-qty;await put("cards",{...c,qty:left,status:left<=0?"sold":c.status});return sale;
}
async function sellLotCore(L,price,meta){
  const st=lotStats(L);
  const sale={lotId:L.id,code:"LOT",name:L.name,variant:"",lang:st.langs.join("+"),kind:"lot",qty:1,price:Math.round(price*100)/100,costEach:Math.round(st.cost*100)/100,items:st.cards.map(c=>({cardId:c.id,qty:n(c.qty)})),...meta};
  await put("sales",sale);for(const c of st.cards)await put("cards",{...c,prevStatus:c.status,qty:0,status:"sold"});await put("lots",{...L,status:"sold",soldDate:sale.date});return sale;
}
async function sellItemCore(i,qty,priceEach,meta){
  const sale={itemId:i.id,code:"ITEM",name:i.name,kind:"item",qty,price:Math.round(priceEach*100)/100,costEach:n(i.cost),...meta};
  await put("sales",sale);await put("items",{...i,qty:Math.max(0,n(i.qty)-qty)});return sale;
}

async function undoSaleCore(s){
  if(s.itemId){const i=byId("items",s.itemId);if(i)await put("items",{...i,qty:n(i.qty)+n(s.qty)});}
  else if(s.lotId){for(const it of (s.items||[])){const c=byId("cards",it.cardId);if(c)await put("cards",{...c,qty:n(c.qty)+n(it.qty),status:c.prevStatus||"stock"});}const L=byId("lots",s.lotId);if(L)await put("lots",{...L,status:"stock",soldDate:""});}
  else{const c=s.cardId&&byId("cards",s.cardId);if(c)await put("cards",{...c,qty:n(c.qty)+n(s.qty),status:c.status==="sold"?"stock":c.status});}
  await del("sales",s.id);
}
/* Trade math: cost basis carries over. Cash received realizes profit on the share of what you gave
   that the cash "bought"; the rest of your cost moves into the cards you get. Cash you pay adds to their cost. */
function tradeMath(costOut,valueIn,cashNet){
  const soldFrac=cashNet>0?(cashNet+valueIn>0?cashNet/(cashNet+valueIn):1):0;
  const realizedCost=costOut*soldFrac;
  return{soldFrac,realizedCost,realized:cashNet>0?cashNet-realizedCost:0,basisIn:costOut-realizedCost+(cashNet<0?-cashNet:0)};
}
const r2=v=>Math.round(n(v)*100)/100;

function pgDings(r){if(!r)return null;let corners=0,edges=0;for(const k in r.corners){const c=r.corners[k];if(c.ok&&(c.fray<990||c.fill<990||c.chamfer))corners++;}for(const k in r.edges){const e=r.edges[k];if(e&&(e.fray<990||e.fill<990))edges++;}return{corners,edges};}

function pgScore(v,warn){return `<b class="num ${v<990?"neg":""}">${v==null?"—":v}</b>`;}
function pgReport(R){

async function pgRun(){
  if(PG.busy)return;PG.busy=true;PG.status="";render();
  const setS=t=>{PG.status=t;const el=document.getElementById("pg-status");if(el)el.textContent=t;};
  const R={date:today(),img:{}};
  try{
    for(const [k,label] of PG_SIDES){if(!PG[k])continue;setS(`Measuring the ${label.toLowerCase()}…`);await new Promise(r=>setTimeout(r,60));
      const res=pgAnalyze(PG[k].im);R[k]=res;R.img[k]=pgImages(res,PG[k].im);}
    PG.report=R;setS("");
  }catch(e){setS(e.message||"Something went wrong measuring this photo.");}
  PG.busy=false;render();
  const sc=document.getElementById("scroller");const rep=document.querySelector("#main .section");if(sc&&rep)sc.scrollTo({top:rep.offsetTop-10,behavior:"smooth"});
}

const SC_PX=30,SC_X0=40,SC_X1=57.2,SC_Y0=81.6,SC_Y1=86.6;

function scCodeImage(im,H){const wp=pgWarp(im,H,[255,255,255],SC_X0,SC_Y0,SC_X1,SC_Y1,SC_PX);const W=wp.w,Hh=wp.h,n=W*Hh;

    while(sp){const j=st[--sp];cnt++;const x=j%W,y=(j/W)|0;if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;
      for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const xx=x+dx,yy=y+dy;if(xx<0||yy<0||xx>=W||yy>=Hh)continue;const k=yy*W+xx;if(m[k]&&lab[k]<0){lab[k]=comps.length;st[sp++]=k;}}}

  if(ch.length<3)return null;

/* card codes as printed: OP06-094, ST01-001, EB01-001, PRB01-001, P-082 */
function scParse(txt){let t=String(txt||"").toUpperCase().replace(/[\s_.,:;'"`]/g,"").replace(/[–—~=]/g,"-");
  const dig=s=>s.replace(/[OQD]/g,"0").replace(/[IL|]/g,"1").replace(/Z/g,"2").replace(/S/g,"5").replace(/G/g,"6").replace(/B/g,"8").replace(/T/g,"7").replace(/A/g,"4");
  let m=t.match(/(PRB|0P|OP|ST|5T|EB|E8)-?([0-9OQDILZSGBTA]{2})-?([0-9OQDILZSGBTA]{3})/);
  if(m){const pre={"0P":"OP","5T":"ST","E8":"EB"}[m[1]]||m[1];return `${pre}${dig(m[2])}-${dig(m[3])}`;}
  m=t.match(/(?:^|[^A-Z0-9])P-?([0-9OQDILZSGBTA]{3})(?![0-9])/)||t.match(/^P-?([0-9OQDILZSGBTA]{3})/);if(m)return `P-${dig(m[1])}`;
  return null;}
/* English or Japanese: look for the English name / everyday English rules words in the lower half of the card */
const SC_EN_WORDS=["THE","YOUR","THIS","YOU","OPPONENT","OPPONENTS","PLAY","WHEN","TURN","LEADER","ATTACK","ATTACKS","COST","TRASH","DECK","HAND","RESTED","ACTIVE","BLOCKER","RUSH","TRIGGER","POWER","GAINS","GIVE","DRAW","CARD","CARDS","FROM","WITH","THAN","LESS","ONCE","UP","TO","OR","AND","OF","ON","ALL","ADD","THEN","IF","MAY","MAIN","END","DURING","BATTLE"];
function scTextImage(im,H){const wp=pgWarp(im,H,[255,255,255],8,69,55,80.8,24);const n=wp.w*wp.h,g=new Float32Array(n);
  for(let i=0;i<n;i++)g[i]=0.299*wp.d[i*3]+0.587*wp.d[i*3+1]+0.114*wp.d[i*3+2];
  // name and type line are usually light letters on a dark band: make the letters dark on white
  const T=pgOtsu(g,256);let hiN=0;for(let i=0;i<n;i++)if(g[i]>T)hiN++;const inv=hiN<n/2;const out=new Uint8ClampedArray(n);
  for(let i=0;i<n;i++)out[i]=Math.max(0,Math.min(255,Math.round(inv?255-g[i]:g[i])));return {w:wp.w,h:wp.h,d:out};}
function scLangFromText(txt,enName){const T=String(txt||"").toUpperCase();const words=T.match(/[A-Z]{2,}/g)||[];
  let common=0;for(const w of words)if(SC_EN_WORDS.includes(w))common++;
  const letters=T.replace(/[^A-Z]/g,""),nm=String(enName||"").toUpperCase().replace(/[^A-Z]/g,"");
  let nameHit=false;if(nm.length>=3){// longest common substring share
    let best=0;for(let i=0;i<nm.length;i++)for(let j=i+3;j<=nm.length;j++){if(j-i<=best)continue;if(letters.includes(nm.slice(i,j)))best=j-i;}nameHit=best>=Math.min(nm.length,Math.max(4,Math.round(nm.length*0.6)));}
  return {lang:nameHit||common>=3?"EN":"JP",common,nameHit};}
/* extra views of the code line for full-art / foil cards where the code is outlined lettering on busy art:
   plain grey, each colour channel, both polarities, and a local-contrast version. Only answers that match a real card are trusted. */
function scCodeViews(im,H,box){const b=box||[42,81.9,57.4,85.7],px=b[4]||24,wp=pgWarp(im,H,[255,255,255],b[0],b[1],b[2],b[3],px);const W=wp.w,Hh=wp.h,n=W*Hh;const views=[];
  const chan=f=>{const g=new Float32Array(n);for(let i=0;i<n;i++)g[i]=f(wp.d[i*3],wp.d[i*3+1],wp.d[i*3+2]);return g;};
  const norm=(g,inv)=>{const s=[...g].sort((a,b)=>a-b);const lo=s[Math.floor(n*0.02)],hi=s[Math.floor(n*0.98)];const out=new Uint8ClampedArray(n);
    for(let i=0;i<n;i++){let t=(g[i]-lo)/Math.max(1,hi-lo);t=Math.max(0,Math.min(1,t));out[i]=Math.round(255*(inv?1-t:t));}return {w:W,h:Hh,d:out};};
  const lum=chan((r,g,b)=>0.299*r+0.587*g+0.114*b);
  // local contrast: pixel minus its neighbourhood (flattens the art behind the letters)
  const bl=Float32Array.from(lum);pgBoxBlur(bl,W,Hh,Math.round(0.6*px));pgBoxBlur(bl,W,Hh,Math.round(0.6*px));const lc=new Float32Array(n);for(let i=0;i<n;i++)lc[i]=lum[i]-bl[i];
  const chans=[lum,lc,chan((r,g,b)=>r),chan((r,g,b)=>g),chan((r,g,b)=>b),chan((r,g,b)=>Math.max(r,g,b)-Math.min(r,g,b))];
  for(const c of chans){views.push(norm(c,true));views.push(norm(c,false));}
  // binary views: letters as solid dark shapes on white
  const bin=m=>{const out=new Uint8ClampedArray(n);for(let i=0;i<n;i++)out[i]=m[i]?0:255;return {w:W,h:Hh,d:out};};
  const fillHoles=m=>{const seen=new Uint8Array(n),st=[];for(let x=0;x<W;x++){st.push(x,(Hh-1)*W+x);}for(let y=0;y<Hh;y++){st.push(y*W,y*W+W-1);}
    while(st.length){const j=st.pop();if(seen[j]||m[j])continue;seen[j]=1;const x=j%W,y=(j/W)|0;if(x>0)st.push(j-1);if(x<W-1)st.push(j+1);if(y>0)st.push(j-W);if(y<Hh-1)st.push(j+W);}
    const o=new Uint8Array(n);for(let i=0;i<n;i++)o[i]=seen[i]?0:1;return o;};
  const sd=Math.sqrt(lc.reduce((a,v)=>a+v*v,0)/n);
  for(const k of [0.6,1.0]){const hi=new Uint8Array(n),lo=new Uint8Array(n);for(let i=0;i<n;i++){hi[i]=lc[i]>k*sd?1:0;lo[i]=lc[i]<-k*sd?1:0;}
    views.push(bin(hi));views.push(bin(fillHoles(lo)));}
  return views;}
/* ---- graded slab label (PSA, BGS, CGC, TAG): grade, cert, card number, language ---- */
const SC_GRADEWORDS=[["GEM MINT",10],["GEM MT",10],["PRISTINE",10],["MINT",9],["NM-MT",8],["NM MT",8],["EX-MT",6],["EX MT",6],["VG-EX",4],["VG EX",4],["NM",7],["EX",5],["VG",3],["GOOD",2],["FAIR",1.5],["POOR",1]];
function scParseLabel(txt){const T=String(txt||"").toUpperCase().replace(/[|]/g," ");const flat=T.replace(/\s+/g," ");const out={};
  const cert=(flat.match(/\b(\d{8,10})\b/)||[])[1];if(cert)out.cert=cert;
  if(/BECKETT|\bBGS\b/.test(flat))out.grader="BGS (Beckett)";else if(/\bCGC\b/.test(flat))out.grader="CGC";else if(/\bTAG\b/.test(flat))out.grader="TAG";
  else if(/\bPSA\b|GEM\s*M|NM-?\s*MT|EX-?\s*MT|\bMINT\b/.test(flat))out.grader="PSA";
  const sq=flat.replace(/\s+/g,"");
  for(const [w,g] of SC_GRADEWORDS){const k=w.replace(/[\s-]/g,"");const i=sq.replace(/-/g,"").indexOf(k);if(i<0)continue;
    const after=sq.replace(/-/g,"").slice(i+k.length,i+k.length+4).match(/^(10|[1-9](?:\.5)?)/);out.grade=after?after[1]:String(g);break;}
  if(!out.grade){const m=flat.match(/\b(?:GRADE|PSA|BGS|CGC|TAG)\s*(10|[1-9](?:\.5)?)\b/);if(m)out.grade=m[1];}
  const num=(flat.match(/#\s*([A-Z]{0,4}\d{0,2}-?)?([0-9OIL]{3})\b/)||[]);if(num[2])out.num=num[2].replace(/O/g,"0").replace(/[IL]/g,"1");
  const set=(flat.match(/\b(OP|ST|EB|PRB)\s?-?(\d{2})\b/)||[]);if(set[1])out.set=set[1]+set[2];
  out.lang=/\bJPN\b|JAPANESE|\bJP\b/.test(flat)?"JP":(out.grader?"EN":null);
  out.letters=flat.replace(/[^A-Z]/g,"");return out;}
/* how much of a name shows up in noisy text: share of its letters covered by pieces (3+ letters) found in the text */
function scNameCover(name,letters){const nm=String(name||"").toUpperCase().replace(/[^A-Z]/g,"");if(nm.length<3)return 0;let cov=0,i=0;
  while(i<nm.length){let best=0;for(let j=nm.length;j>=i+3;j--){if(letters.includes(nm.slice(i,j))){best=j-i;break;}}if(best){cov+=best;i+=best;}else i++;}return cov/nm.length;}
/* cards whose English name matches noisy text; optional card number (e.g. "106") and set hint */
function scByName(letters,num,setHint){letters=String(letters||"").replace(/CHARACTER|COUNTER|SPECIAL|LEADER|EVENT|STAGE|TRIGGER|BLOCKER/g,"");const byName={};for(const [code,e] of Object.entries(CARDDB)){if(!e[0])continue;if(num&&!code.endsWith("-"+num))continue;(byName[e[0]]=byName[e[0]]||[]).push(code);}
  let best=[];for(const [nm,codes] of Object.entries(byName)){const c=scNameCover(nm,letters);const L=nm.replace(/[^A-Za-z]/g,"").length;
    if(num?((c>=0.6&&c*L>=3)||(c===1&&L>=3)):((c>=0.75&&c*L>=7)||(c===1&&L>=5)))best.push({nm,codes,score:c*L-0.5*(1-c)*L});}
  best.sort((a,b)=>b.score-a.score);if(!best.length)return [];const top=best.filter(b=>b.score>=best[0].score-0.5);
  const rank=c=>{const m=c.match(/^([A-Z]+)(\d*)-(\d+)/)||[];return [{OP:0,EB:1,PRB:2,ST:3,P:4}[m[1]]??5,-(+m[2]||0),+m[3]||0];};
  let codes=[].concat(...top.map(b=>b.codes)).sort((a,b)=>{const x=rank(a),y=rank(b);return x[0]-y[0]||x[1]-y[1]||x[2]-y[2];});if(setHint)codes.sort((a,b)=>(b.startsWith(setHint)?1:0)-(a.startsWith(setHint)?1:0));return codes.slice(0,20);}

/* ---- on-phone text reader (Tesseract.js, open source), loaded the first time it's needed ---- */
let SC_WORKER=null;
function scLoadScript(src){return new Promise((res,rej)=>{if(window.Tesseract)return res();const s=document.createElement("script");s.src=src;s.onload=()=>res();s.onerror=()=>rej(new Error("load"));document.head.appendChild(s);});}
async function scWorker(){
  if(SC_WORKER)return SC_WORKER;
  SC_WORKER=(async()=>{
    const local=!!window.TL_STANDALONE,base=local?new URL("ocr/",location.href).href:null;
    await scLoadScript(local?base+"tesseract.min.js":"https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js");
    const opts=local?{workerPath:base+"worker.min.js",corePath:base+"core",langPath:base+"lang",workerBlobURL:false}:{};
    return await Tesseract.createWorker("eng",1,opts);})();
  try{return await SC_WORKER;}catch(e){SC_WORKER=null;throw e;}
}
function scCanvas(g){const c=document.createElement("canvas");c.width=g.w;c.height=g.h;const x=c.getContext("2d");const id=x.createImageData(g.w,g.h);
  for(let i=0;i<g.w*g.h;i++){const v=g.d[i];id.data[i*4]=v;id.data[i*4+1]=v;id.data[i*4+2]=v;id.data[i*4+3]=255;}x.putImageData(id,0,0);return c;}
async function scOCR(w,g,mode,whitelist){await w.setParameters({tessedit_char_whitelist:whitelist||"",tessedit_pageseg_mode:mode});const r=await w.recognize(scCanvas(g));return r.data;}
const SC_CODECHARS="ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-";
/* photo -> what could be read: {code, entry, lang, label, cands} */
async function scanCard(file,status){
  status("Finding the card…");await new Promise(r=>setTimeout(r,30));
  const im0=await pgLoad(file);try{URL.revokeObjectURL(im0.url);}catch(_){}
  let im=pgFlatten(im0),bg;if(im.ok)bg=im.bgRef;else{im=im0;bg=pgBackground(im0);}
  let cl;try{cl=pgCardLines(im,bg);}catch(e){return {err:"nocard"};}
  const H=pgHomography([cl.TL,cl.TR,cl.BR,cl.BL],[[0,0],[CARD_W,0],[CARD_W,CARD_H],[0,CARD_H]]);
  status("Loading the text reader…");
  let w;try{w=await scWorker();}catch(e){return {err:"reader"};}
  // 1) the code: read several prepared views; trust a code only when views agree (or the clean read matches a real card)
  const votes={};let code=null,HH=null;
  const vote=(c,wt)=>{if(!c)return;votes[c]=(votes[c]||0)+wt*(CARDDB[c]?1:0.4);};
  const pick=()=>{let b=null;for(const c in votes)if(!b||votes[c]>votes[b])b=c;return b&&votes[b]>=2?b:null;};
  for(const Hx of [H,(u,v)=>H(CARD_W-u,CARD_H-v)]){
    status("Reading the code…");
    const ci=scCodeImage(im0,Hx);if(ci){const d=await scOCR(w,ci,"7",SC_CODECHARS);const c=scParse(d.text);window.TL_SCAN_LAST={raw:d.text,conf:d.confidence};if(c&&CARDDB[c]&&d.confidence>=45){code=c;HH=Hx;break;}vote(c,1);}
    const views=scCodeViews(im0,Hx);
    for(let k=0;k<views.length&&!pick();k++){if(k===4)status("The code is hard to read, trying harder…");vote(scParse((await scOCR(w,views[k],"7",SC_CODECHARS)).text),1);}
    code=pick();if(code){HH=Hx;break;}
  }
  // 2) graded slab: the label above the card
  let label=null;const ch=Math.hypot(cl.BL[0]-cl.TL[0],cl.BL[1]-cl.TL[1]),top=Math.min(cl.TL[1],cl.TR[1]);
  if(top>ch*0.12){status("Reading the slab label…");
    const y0=Math.max(0,Math.round(top-0.42*ch)),y1=Math.round(top-0.02*ch),x0=Math.max(0,Math.round(Math.min(cl.TL[0],cl.BL[0])-0.12*ch)),x1=Math.min(im0.w,Math.round(Math.max(cl.TR[0],cl.BR[0])+0.12*ch));
    const k=Math.min(2,1400/Math.max(1,x1-x0)),W=Math.round((x1-x0)*k),Hh=Math.round((y1-y0)*k),g=new Uint8ClampedArray(W*Hh);
    for(let y=0;y<Hh;y++)for(let x=0;x<W;x++){const sx=Math.min(im0.w-1,Math.round(x0+x/k)),sy=Math.min(im0.h-1,Math.round(y0+y/k)),i=(sy*im0.w+sx)*4;g[y*W+x]=Math.round(0.299*im0.d[i]+0.587*im0.d[i+1]+0.114*im0.d[i+2]);}
    const t=(await scOCR(w,{w:W,h:Hh,d:g},"6")).text+" "+(await scOCR(w,{w:W,h:Hh,d:g},"11")).text;
    const L=scParseLabel(t);if(L.grader||L.cert||L.num)label=L;}
  let cands=[];
  if(!code&&label&&label.num){const c=scByName(label.letters,label.num,label.set);if(c.length===1)code=c[0];else cands=c;}
  if(!code&&!cands.length&&label&&label.letters){const words=label.letters.replace(/ONEPIECE|JAPANESE|JPN|GEMMT|GEMMINT|MINT|SPECIAL|ALTART|PARALLEL|MANGA|PROMO|PSA|BGS|CGC|TAG|BECKETT|CERT/g,"");cands=scByName(words,null,label.set);}
  // 3) still nothing: read the card's name and offer the matching cards
  if(!code&&!cands.length){status("Reading the name…");let letters="";
    for(const g of scCodeViews(im0,H,[6,72,57,82.5,12]).slice(0,8))letters+=" "+(await scOCR(w,g,"11")).text.toUpperCase().replace(/[^A-Z]/g,"");
    cands=scByName(letters);}
  const entry=code?CARDDB[code]||null:null;let lang=label&&label.lang||null;
  if(code&&!lang){if(entry&&!entry[0])lang="JP";else{status("Checking the language…");lang=scLangFromText((await scOCR(w,scTextImage(im0,HH||H),"11")).text,entry&&entry[0]).lang;}}
  if(!code&&!cands.length)return {err:"nocode",label};
  return {code,entry,lang,label,cands};
}
function scFill(form,code,lang,label){
  const e=CARDDB[code]||null;
  const set=(name,v)=>{const el=form.elements[name];if(!el||v==null||v==="")return;if(el instanceof RadioNodeList)[...el].forEach(x=>x.checked=x.value===v);else el.value=v;};
  set("code",code);if(e){set("name",e[0]||e[1]);if(RARITIES.includes(e[2]))set("rarity",e[2]);}
  if(lang){set("lang",lang);if(form.imgSuffix&&form.imgSuffix.value!=="link"&&form.officialImg)form.officialImg.value="";}
  if(label&&label.grader){set("kind","graded");form.querySelector("#rawBox").hidden=true;form.querySelector("#gradedBox").hidden=false;
    if(GRADERS.includes(label.grader))set("grader",label.grader);set("grade",label.grade);set("cert",label.cert);}
  if(form._refreshPicker)form._refreshPicker();
}
async function scanIntoForm(form,file){
  const st=form.querySelector("#f-readst"),btn=form.querySelector("#f-scan");if(!file)return;
  let box=form.querySelector("#f-cands");if(!box){box=document.createElement("div");box.id="f-cands";box.className="vpick";box.style.marginTop="6px";st.after(box);}box.innerHTML="";
  if(btn)btn.disabled=true;const say=t=>{st.textContent=t;};
  try{
    const r=await scanCard(file,say);
    if(r.err==="nocard"){say("Couldn't find the card in the photo. Lay it on a plain surface, fill most of the frame, and try again, or type the code.");return;}
    if(r.err==="reader"){say("The text reader couldn't load. Connect to the internet once so it can download (about 7 MB), then it works offline.");return;}
    const L=r.label,slab=L&&L.grader?` · ${L.grader.split(" ")[0]} ${L.grade||"?"}${L.cert?` · cert ${L.cert}`:""}`:"";
    if(r.err==="nocode"){if(L&&L.grader)scFill(form,form.code.value.trim(),L.lang,L);
      say(`Couldn't read the code${slab?` (filled in the slab details${slab})`:""}. Try a sharper, closer photo without glare on the bottom-right corner, or type it.`);return;}
    if(r.code){scFill(form,r.code,r.lang,L);const e=r.entry;const jp=e&&e[1]&&r.lang==="JP"?` (${e[1]})`:"";
      say(e?`Read ${r.code} · ${e[0]||e[1]}${jp} · ${r.lang==="JP"?"Japanese":"English"}${slab}. Check it, then pick your version below.`
           :`Read ${r.code}${slab}, but it isn't in the card list yet (newer set?). Check the code and type the name.`);return;}
    // several possible cards: let the user tap the right one
    const lang=r.lang||(L&&L.lang)||"EN";
    say(`Couldn't read the code clearly${slab}. It looks like ${[...new Set(r.cands.map(c=>CARDDB[c][0]))].join(" or ")}. Tap your card:`);
    box.innerHTML=r.cands.map(c=>{const e=CARDDB[c];const nm=esc(e[0]||e[1]);const alt=lang==="JP"?"EN":"JP";
      // picture from the official site in the card's language, then the other site, then just the name
      const img=CAN_OFFICIAL?`<img src="${esc(officialUrl(c,lang,""))}" data-alt="${esc(officialUrl(c,alt,""))}" alt="${nm}" referrerpolicy="no-referrer" onerror="if(this.dataset.alt){this.src=this.dataset.alt;this.dataset.alt='';}else{this.replaceWith(Object.assign(document.createElement('span'),{className:'cand-noimg',textContent:this.alt}));}">`:`<span class="cand-noimg">${nm}</span>`;
      return `<button type="button" data-code="${esc(c)}" aria-pressed="false" title="${esc(c)} ${nm}">${img}<span class="mono" style="font-size:11px">${esc(c)} ${esc(e[2]||"")}</span><span style="font-size:10.5px;font-weight:500;line-height:1.2">${nm}</span></button>`;}).join("");
    box.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{const c=b.dataset.code;
      scFill(form,c,r.lang||(CARDDB[c][0]?(L&&L.lang)||"EN":"JP"),L);box.innerHTML="";say(`Picked ${c} · ${CARDDB[c][0]||CARDDB[c][1]}${slab}. Check it, then pick your version below.`);}));
    if(L&&L.grader)scFill(form,form.code.value.trim(),L.lang,L);
  }catch(e){say("Something went wrong reading the photo. Type the code instead.");}
  finally{if(btn)btn.disabled=false;}
}

/* ---------- boot ---------- */
render();
(async()=>{
  if(window.TL_STANDALONE){
    try{
      await IDB.open();
      for(const col of COLS)S[col]=(await IDB.all(col)).map(([,v])=>v);
      const st=await IDB.get("settings","main");if(st)S.settings={...DEFAULT_SETTINGS,...st};
      for(const [id,blob] of await IDB.all("photos")){try{PHOTO_URLS[id]=URL.createObjectURL(blob);}catch(_){}}
      S.idb=true;S.live=true;S.assets=localAssets;S.downloads=localDownloads;useApiKey();
      try{if(navigator.storage&&navigator.storage.persist)await navigator.storage.persist();}catch(_){}
    }catch(e){S.live=false;S.downloads=localDownloads;}
    S.loaded=true;render();return;
  }
  const cl=window.claude;
  if(!cl||!cl.use){S.loaded=true;render();return;}
  const [db,assets,downloads,sample]=await Promise.all([cl.use("db").catch(()=>null),cl.use("assets").catch(()=>null),cl.use("downloads").catch(()=>null),cl.use("sample").catch(()=>null)]);
  S.db=db;S.assets=assets;S.downloads=downloads;S.sample=sample;
  if(sample){try{const lim=await sample.limits();S.sampleImg=!!(lim&&lim.images);}catch(_){S.sampleImg=false;}}S.live=!!db;S.loaded=true;
  if(!db){render();return;}
  COLS.forEach(col=>{
    db.collection(col).limit(1000).onSnapshot(snap=>{S[col]=snap.docs.map(d=>({id:d.id,...d.data()}));render();},err=>{toast("Couldn't load "+col+": "+(err.message||err.code));});
  });
  db.doc("settings/main").onSnapshot(snap=>{if(snap.exists)S.settings={...DEFAULT_SETTINGS,...snap.data()};render();},()=>{});
  render();
})();
})();
</script>
